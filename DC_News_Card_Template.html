<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- DC News card v2 "The Tell" (approved 2026-10-14). Filled by 16b via fillTemplate(); every double-brace token is required (empty string when unused).
     LAYOUT: hero | portrait | split | quote. No yellow: DC red only. Bottom scrim tops out at 50% so the photo stays the hero; text carries its own halo. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700&display=swap');
  :root { --bg:#0a0a0a; --red:#c42a1c; --red2:#9c1c1c; --hot:#ff6a55; --pad:56px;
    --halo:0 0 14px rgba(0,0,0,.9), 0 2px 4px rgba(0,0,0,.95); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; background:var(--bg); }
  .card { position:relative; width:1080px; height:1350px; overflow:hidden; background:var(--bg); }

  /* True hero, with a subtle "evidence photo" treatment: slightly cooled, fine grain, corner marks */
  .hero { position:absolute; inset:0; background-size:cover; background-position:center; filter:grayscale(.35) contrast(1.06); }
  .hero.nophoto { background:radial-gradient(circle at 50% 38%, #2a0603 0%, #120302 40%, #0a0a0a 72%); filter:none; }
  .grain { position:absolute; inset:0; opacity:.13; mix-blend-mode:overlay;
    background-image:repeating-radial-gradient(circle at 17% 32%, rgba(255,255,255,.5) 0 1px, transparent 1px 3px); }
  .shade { position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 16%),
      linear-gradient(180deg, rgba(0,0,0,0) 58%, rgba(8,5,4,.32) 72%, rgba(8,5,4,.5) 86%, rgba(8,5,4,.5) 100%); }
  .cr { position:absolute; width:70px; height:70px; border:0 solid rgba(255,255,255,.75); }
  .cr.tl { top:130px; left:40px; border-top-width:5px; border-left-width:5px; }
  .cr.br { bottom:540px; right:40px; border-bottom-width:5px; border-right-width:5px; }
  .v-split .cr { display:none; }

  /* Hero + Portrait: circular inset under the date */
  .portrait { position:absolute; top:128px; right:var(--pad); width:300px; text-align:center; display:none; }
  .portrait .ring { width:300px; height:300px; border-radius:50%; border:6px solid #fff; background-size:cover; background-position:center 30%;
    box-shadow:0 10px 40px rgba(0,0,0,.55); }
  .portrait .lab { display:inline-block; margin-top:12px; padding:6px 12px 4px; font:700 24px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em;
    color:#fff; background:rgba(12,11,10,.72); text-transform:uppercase; }
  .v-portrait .portrait { display:block; }

  /* Split: two full-height panels under the same light fade */
  .split { position:absolute; inset:0; display:none; }
  .split .p { position:absolute; top:0; width:537px; height:1350px; background-size:cover; background-position:center top; filter:grayscale(.35) contrast(1.06); }
  .split .p.l { left:0; } .split .p.r { right:0; }
  .split .div { position:absolute; left:537px; top:0; width:6px; height:1350px; background:var(--red); }
  .v-split .split { display:block; } .v-split .hero { display:none; }

  /* Top corners */
  .mark { position:absolute; top:var(--pad); left:var(--pad); display:flex; align-items:center; gap:14px; color:#fff;
    font:400 40px/1 'Bebas Neue',sans-serif; letter-spacing:.14em; text-shadow:var(--halo); }
  .mark::before { content:''; width:6px; height:36px; background:var(--red); }
  .when { position:absolute; top:calc(var(--pad) + 6px); right:var(--pad); font:600 24px/1 'Barlow Condensed',sans-serif;
    letter-spacing:.16em; color:rgba(255,255,255,.88); text-shadow:var(--halo); }

  /* Bottom: PLACE | OUTCOME | NAME, headline, the tell, footer */
  .text { position:absolute; left:var(--pad); right:var(--pad); bottom:92px; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; margin-bottom:16px; font:700 27px/1.25 'Barlow Condensed',sans-serif; letter-spacing:.16em;
    color:#fff; text-transform:uppercase; text-shadow:var(--halo); }
  .meta .bar { color:var(--red); margin:0 12px; }
  .meta .who { color:var(--hot); }
  .meta .who::before { content:'|'; color:var(--red); margin:0 12px; }
  .upd { font:700 18px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em; color:#fff; border:2px solid rgba(255,255,255,.85); padding:5px 9px 4px; margin-left:16px; }
  .kicker { font:700 26px/1.2 'Barlow Condensed',sans-serif; letter-spacing:.12em; color:#eee; text-transform:uppercase; margin-bottom:12px;
    text-shadow:var(--halo); }
  h1 { font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:104px; line-height:.96; letter-spacing:.005em; color:#fff;
    text-shadow:0 0 30px rgba(0,0,0,.85), 0 3px 8px rgba(0,0,0,.9); }
  h1 em { font-style:normal; color:var(--hot); }
  .verdict { display:inline-block; margin-top:16px; background:var(--red2); color:#fff; font:700 30px/1 'Barlow Condensed',sans-serif;
    letter-spacing:.1em; padding:12px 18px 10px; }
  .tell { display:flex; align-items:center; gap:16px; margin-top:24px; font:700 36px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em;
    color:#fff; text-transform:uppercase; text-shadow:var(--halo); }
  .tell .tl { flex:none; background:var(--red2); padding:10px 15px 8px; text-shadow:none; }
  .foot { position:absolute; left:var(--pad); right:var(--pad); bottom:38px; display:flex; justify-content:space-between; align-items:baseline;
    font:600 19px/1 'Barlow Condensed',sans-serif; letter-spacing:.12em; color:rgba(255,255,255,.85); text-transform:uppercase; text-shadow:var(--halo); }
  .foot b { color:#fff; font-weight:700; }
  .upd:empty, .kicker:empty, .verdict:empty, .lab:empty, .meta .who:empty { display:none; }
  /* Own rule: a renderer without :has() drops only this line, not every empty-hide above. */
  .tell:has(.tt:empty) { display:none; }
</style>
</head>
<body>
<div class="card v-{{LAYOUT}}">
  <div class="hero" id="hero" data-src="{{HERO_URL}}" style="background-image:url('{{HERO_URL}}');background-position:{{HERO_POS}}"></div>
  <div class="split"><div class="p l" style="background-image:url('{{SPLIT_L_URL}}');background-position:{{SPLIT_L_POS}}"></div><div class="p r" style="background-image:url('{{SPLIT_R_URL}}');background-position:{{SPLIT_R_POS}}"></div><div class="div"></div></div>
  <div class="grain"></div>
  <div class="shade"></div>
  <div class="cr tl"></div><div class="cr br"></div>
  <div class="mark">DARKEST CRIMES</div>
  <div class="when">{{DATE}}</div>
  <div class="portrait"><div class="ring" style="background-image:url('{{SECOND_URL}}');background-position:{{SECOND_POS}}"></div><div class="lab">{{SECOND_LABEL}}</div></div>
  <div class="text" id="text">
    <div class="meta"><span>{{PLACE}}</span><span class="bar">|</span><span>{{OUTCOME}}</span><span class="who">{{META_NAME}}</span><span class="upd">{{UPDATE}}</span></div>
    <div class="kicker">{{KICKER}}</div>
    <h1 id="h1">{{HEADLINE_HTML}}</h1>
    <div class="verdict">{{VERDICT_BAR}}</div>
    <div class="tell"><span class="tl">{{TELL_LABEL}}</span><span class="tt">{{TELL_TEXT}}</span></div>
  </div>
  <div class="foot"><b>@DARKEST.CRIMES</b><span>{{SOURCES}}</span></div>
</div>
<script>
  var hero = document.getElementById('hero');
  if (!hero.getAttribute('data-src')) hero.className += ' nophoto';
  // Fit: headline <= 3 lines and the text block <= 440px (bottom ~third of the frame, tell included).
  document.fonts.ready.then(function () {
    var h1 = document.getElementById('h1'), text = document.getElementById('text'), fs = 104;
    function lines() { return Math.round(h1.offsetHeight / (fs * .96)); }
    while ((lines() > 3 || text.offsetHeight > 440) && fs > 64) { fs -= 2; h1.style.fontSize = fs + 'px'; }
    document.body.setAttribute('data-ready', '1');
  });
</script>
</body>
</html>
