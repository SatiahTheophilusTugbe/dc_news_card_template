<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- DC News card v3 "Jinx" (approved 2026-10-17). One file, four renders per story, picked by the SLIDE token:
     card (hook: pill + headline over the hero), tell (slide 2), payoff (slide 3), proof (the three slides at phone width
     for the approval message). Filled by 16b via fillTemplate(); every double-brace token is required ('' when unused).
     The house grade is the #dcgrade SVG filter on the hero (near black-and-white, clarity, S-curve, trace split tone),
     plus a vignette and a grain layer. Slides 2 and 3 darken the SAME graded photo by an identical 0.38. No blur anywhere.
     Colours: amber pill #ff7a1a / text #140800; DC red #c42a1c only as the wordmark bar; white type. No yellow. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700&display=swap');
  :root { --bg:#0a0a0a; --red:#c42a1c; --amber:#ff7a1a; --ink:#140800; --pad:64px;
    --halo:0 2px 2px rgba(0,0,0,.6), 0 0 28px rgba(0,0,0,.45); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; background:var(--bg); }
  .card { position:relative; width:1080px; height:1350px; overflow:hidden; background:var(--bg); color:#fff; font-family:'Barlow Condensed',sans-serif; }

  /* The hero photo, graded in place. Slides 2 and 3 push the same photo down by the same amount. */
  .hero { position:absolute; inset:0; background-size:cover; background-position:center; filter:url(#dcgrade); }
  .s-tell .hero, .s-payoff .hero, .s-closer .hero { filter:url(#dcgrade) brightness(.38); }
  .hero.nophoto { background:radial-gradient(circle at 50% 38%, #2a0603 0%, #120302 40%, #0a0a0a 72%); filter:none; }
  .vig { position:absolute; inset:0; background:radial-gradient(ellipse 75% 80% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,.28) 100%); }
  .grain { position:absolute; inset:0; filter:url(#dcgrain); opacity:.09; mix-blend-mode:overlay; background:#808080; }
  /* Card only: a fade keyed to the bottom block so the face stays clear. */
  .fade { display:none; position:absolute; left:0; right:0; bottom:0; height:62%;
    background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 38%, rgba(0,0,0,.78) 70%, rgba(0,0,0,.92) 100%); }
  .s-card .fade { display:block; }

  /* Wordmark */
  .wm { position:absolute; top:var(--pad); left:var(--pad); display:flex; align-items:center; gap:16px; font:400 40px/1 'Bebas Neue',sans-serif; letter-spacing:.14em; text-shadow:var(--halo); }
  .wm i { display:block; width:14px; height:40px; background:var(--red); }
  /* The event date, top right of every slide (Satiah 2026-10-18: an important detail). */
  .when { position:absolute; top:calc(var(--pad) + 8px); right:var(--pad); font:600 24px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em; color:rgba(255,255,255,.88); text-shadow:var(--halo); }

  /* Portrait: circular inset, graded like the hero */
  .portrait { position:absolute; top:128px; right:var(--pad); width:300px; text-align:center; display:none; }
  .portrait .ring { width:300px; height:300px; border-radius:50%; border:6px solid #fff; background-size:cover; background-position:center 30%; filter:url(#dcgrade);
    box-shadow:0 10px 40px rgba(0,0,0,.55); }
  .portrait .lab { display:inline-block; margin-top:12px; padding:6px 12px 4px; font:700 24px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em;
    color:#fff; background:rgba(12,11,10,.72); text-transform:uppercase; }
  .s-card.v-portrait .portrait { display:block; }
  /* The inset sits on the side away from the hero's face (INSET_SIDE from lib/slides insetSide). */
  .inset-left .portrait { left:var(--pad); right:auto; }

  /* The one accent: the amber pill */
  .pill { display:inline-block; background:var(--amber); color:var(--ink); font:700 30px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em; padding:11px 16px 9px; margin-bottom:22px; text-transform:uppercase; }

  /* Slide 1: pill + headline, bottom third */
  .block { display:none; position:absolute; left:var(--pad); right:var(--pad); bottom:var(--pad); }
  .s-card .block { display:block; }
  h1 { font:400 118px/1.0 'Bebas Neue',sans-serif; letter-spacing:.004em; color:#fff; text-shadow:var(--halo); }

  /* Slides 2 and 3: label, line, record */
  .mid { display:none; position:absolute; left:var(--pad); right:var(--pad); top:50%; transform:translateY(-40%); }
  .s-tell .mid, .s-payoff .mid, .s-closer .mid { display:block; }
  .mid h2 { font:400 92px/1.04 'Bebas Neue',sans-serif; color:#fff; text-shadow:var(--halo); }
  .s-payoff .mid h2, .s-closer .mid h2 { font-size:100px; line-height:1.02; }
  .rec { margin-top:34px; font:600 26px/1.3 'Barlow Condensed',sans-serif; letter-spacing:.12em; color:rgba(255,255,255,.78); text-transform:uppercase; text-shadow:var(--halo); }
  /* Payoff only: the pointer to the caption (spec section 3). */
  .cta { display:none; margin-top:34px; font:600 26px/1.3 'Barlow Condensed',sans-serif; letter-spacing:.12em; color:rgba(255,255,255,.78); text-transform:uppercase; text-shadow:var(--halo); }
  .s-closer .cta { display:block; }
  .count { position:absolute; left:var(--pad); bottom:var(--pad); font:600 24px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em; color:rgba(255,255,255,.6); }
  .handle { display:none; position:absolute; right:var(--pad); bottom:var(--pad); font:600 24px/1 'Barlow Condensed',sans-serif; letter-spacing:.16em; color:rgba(255,255,255,.6); }
  .s-closer .handle { display:block; }

  /* Proof: the four rendered slides side by side at phone width, scaled to fit 1080 */
  .proof { display:none; position:absolute; inset:0; background:#111; align-items:center; justify-content:center; gap:12px; }
  .proof img { width:252px; height:315px; object-fit:cover; display:block; background:#000; }
  .s-proof .proof { display:flex; }
  .s-proof .hero, .s-proof .vig, .s-proof .grain, .s-proof .wm, .s-proof .when, .s-proof .count { display:none; }

  .pill:empty, .rec:empty, .count:empty, .lab:empty, .handle:empty, .when:empty { display:none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="dcgrade" color-interpolation-filters="sRGB">
    <!-- 1 red-filter luminance mix -->
    <feColorMatrix type="matrix" values="0.50 0.36 0.14 0 0  0.50 0.36 0.14 0 0  0.50 0.36 0.14 0 0  0 0 0 1 0" result="y"/>
    <!-- 2 clarity: y + 0.28 * (y - blur18(y)) -->
    <feGaussianBlur in="y" stdDeviation="18" result="yl"/>
    <feComposite in="y" in2="yl" operator="arithmetic" k1="0" k2="1.28" k3="-0.28" k4="0" result="yc"/>
    <!-- 3 tone: black point .06, white point .96, cosine S-curve, gamma 1.08, floor .02 (17-point table) -->
    <feComponentTransfer in="yc" result="yt">
      <feFuncR type="table" tableValues="0.0200 0.0200 0.0289 0.0575 0.1068 0.1756 0.2612 0.3596 0.4661 0.5754 0.6819 0.7801 0.8648 0.9316 0.9769 0.9984 1.0000"/>
      <feFuncG type="table" tableValues="0.0200 0.0200 0.0289 0.0575 0.1068 0.1756 0.2612 0.3596 0.4661 0.5754 0.6819 0.7801 0.8648 0.9316 0.9769 0.9984 1.0000"/>
      <feFuncB type="table" tableValues="0.0200 0.0200 0.0289 0.0575 0.1068 0.1756 0.2612 0.3596 0.4661 0.5754 0.6819 0.7801 0.8648 0.9316 0.9769 0.9984 1.0000"/>
    </feComponentTransfer>
    <!-- 4 split tone, a trace: highlights warm, shadows cool -->
    <feComponentTransfer in="yt" result="out">
      <feFuncR type="linear" slope="1.036" intercept="-0.006"/>
      <feFuncG type="linear" slope="1.012" intercept="0"/>
      <feFuncB type="linear" slope="0.96" intercept="0.010"/>
    </feComponentTransfer>
  </filter>
  <filter id="dcgrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/></filter>
</svg>
<div class="card s-{{SLIDE}} v-{{LAYOUT}} inset-{{INSET_SIDE}}">
  <div class="hero" id="hero" data-src="{{HERO_URL}}" style="background-image:url('{{HERO_URL}}');background-position:{{HERO_POS}}"></div>
  <div class="vig"></div>
  <div class="grain"></div>
  <div class="fade"></div>
  <div class="wm"><i></i>DARKEST CRIMES</div>
  <div class="when">{{DATE}}</div>
  <div class="portrait"><div class="ring" style="background-image:url('{{SECOND_URL}}');background-position:{{SECOND_POS}}"></div><div class="lab">{{SECOND_LABEL}}</div></div>
  <div class="block" id="block">
    <div class="pill">{{PILL}}</div>
    <h1 id="h1">{{HEADLINE_HTML}}</h1>
  </div>
  <div class="mid" id="mid">
    <div class="pill">{{TELL_LABEL}}{{PAYOFF_LABEL}}{{CLOSER_LABEL}}</div>
    <h2 id="h2">{{TELL_LINE}}{{PAYOFF_LINE}}{{CLOSER_LINE}}</h2>
    <div class="rec">{{RECORD}}</div>
    <div class="cta">FULL STORY IN THE CAPTION</div>
  </div>
  <div class="count">{{COUNT}}</div>
  <div class="handle">@DARKEST.CRIMES</div>
  <div class="proof"><img src="{{PROOF_1}}" alt=""><img src="{{PROOF_2}}" alt=""><img src="{{PROOF_3}}" alt=""><img src="{{PROOF_4}}" alt=""></div>
</div>
<script>
  var hero = document.getElementById('hero');
  if (!hero.getAttribute('data-src')) hero.className += ' nophoto';
  // Fit. Card: the headline starts at 118px and shrinks (72px floor) until it is at most 3 lines and the block is at most
  // 405px tall (30% of the frame). Slides 2-3: the line starts at 92/100px and shrinks (64px floor) until it is at most 5 lines.
  document.fonts.ready.then(function () {
    var h1 = document.getElementById('h1'), block = document.getElementById('block'), fs = 118;
    function lines(el, size, lh) { return Math.round(el.offsetHeight / (size * lh)); }
    if (h1.textContent.trim()) {
      while ((lines(h1, fs, 1.0) > 3 || block.offsetHeight > 405) && fs > 72) { fs -= 2; h1.style.fontSize = fs + 'px'; }
    }
    var h2 = document.getElementById('h2');
    if (h2.textContent.trim()) {
      var f2 = parseFloat(getComputedStyle(h2).fontSize), lh = parseFloat(getComputedStyle(h2).lineHeight) / f2;
      while (lines(h2, f2, lh) > 5 && f2 > 64) { f2 -= 2; h2.style.fontSize = f2 + 'px'; }
    }
    document.body.setAttribute('data-ready', '1');
  });
</script>
</body>
</html>
